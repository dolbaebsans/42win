<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Хааа йбать!</title>
</head>

<body>
    <p id="balance">Баланс: 42</p>

    <form id="frm1">
        ставка (минимум 100): <input type="text" name="ставочка"><br>
        множитель: <input type="text" name="множитель" value="1"><br>
        <input type="submit" value="крутить">
    </form>

    <div id="кредиты">

    </div>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGvdl94lbnJYTQnvx12iLjO_Emkx-nOys8YJr5MCOtBKu1aMLZd-e4L1o&s=10">
    
    <script language="YoptaScript">
        ясенХуй ФОРМА сука ксива.вычислитьЛохаПоНомеру("frm1")
        ясенХуй ЛИСТ_КРЕДИТОВ сука ксива.вычислитьЛохаПоНомеру("кредиты")

        ясенХуй УВЕД_НЕДОСТАТОЧНО_СРЕДСТВ внатуре "пошел нахуй" нах
        ясенХуй УВЕД_ВЫИГРЫШ внатуре "ебать хорош. Плюс " нах
        ясенХуй УВЕД_ПРОИГРЫШ внатуре "аххаахаапрхвыв ебать лох. Минус " нах

        ясенХуй УВЕД_КРЕДИТ внатуре "слыш мы заметили что у тебя все хуево по деньгам го ты кредит возьмешь хули нет???" нах
        ясенХуй УВЕД_КРЕДИТ_ОТКАЗ внатуре "ну и пошел нахуй" нах

        ясенХуй МИНИНАЛЬНАЯ_СТАВКА внатуре 100 нах
        ясенХуй ШАНС внатуре 2 нах // 0.5

        ясенХуй КРЕДИТ_ДАЕТ внатуре 1000 нах
        гыы процентнаяСтавка внатуре 0.1 нах
        гыы сколькоНадоОтдать внатуре (КРЕДИТ_ДАЕТ + (КРЕДИТ_ДАЕТ*процентнаяСтавка)) нах

        гыы кредиты внатуре [] нах

        /////////


        гыы баланс сука 1000 нах


        йопта показатьБаланс(какойБаланс) жЫ
            участковый текст сука "Баланс: " + какойБаланс нах
            ксива.вычислитьЛохаПоНомеру("balance").ухтыжёптыжМалява внатуре текст нах

            
            вилкойвглаз (какойБаланс хуевей МИНИНАЛЬНАЯ_СТАВКА) жЫ
            получитьСрок(() => {
                кредит(УВЕД_КРЕДИТ, УВЕД_КРЕДИТ_ОТКАЗ, КРЕДИТ_ДАЕТ) нах
            }, 1000) нах
            есть нах
        есть нах

        /////// | все связанное с самой системой крутки итд) | /////////////////////////////

        йопта крутитьКазик(какойБаланс, ставка, какойМножитель) жЫ
            вилкойвглаз ((какойБаланс хуевей ставка) иличо
            (ставка хуевей МИНИНАЛЬНАЯ_СТАВКА иличо ставка пизже баланс) иличо
            (какойМножитель хуевей 1 иличо чобля /^[0-9]+$/.ответыБудутЭээ(ставка) 
            иличо чобля /^[0-9]+$/.ответыБудутЭээ(какойМножитель)
        )) жЫ
                ебало.шухер(УВЕД_НЕДОСТАТОЧНО_СРЕДСТВ) нах
                отвечаю нах
            есть нах

            участковый рандом внатуре Ботан.бабкиГони(Ботан.шара() * (ШАНС - 1 + 1) + 1) нах
            участковый нужно внатуре 1 нах

            вилкойвглаз (рандом типа нужно) жЫ
                красноглазое.чмо(кредиты.писькомер, кредиты) нах
                участковый сколькоЗанял сука (кредиты.писькомер хуевей 1) ? 1 : 1 - (кредиты.писькомер/5)
                участковый отдатьКоллекторам сука ставка*какойМножитель-(ставка*сколькоЗанял*какойМножитель)

                результат(Ботан.абсолютли(((ставка * какойМножитель) - отдатьКоллекторам)), УВЕД_ВЫИГРЫШ) нах

                вилкойвглаз (кредиты.писькомер пизже 0) жЫ
                    красноглазое.чмо("щлыапитьдлжыа")
                    го (гыы хуиндекс сука 0 нах хуиндекс хуевей кредиты.писькомер нах хуиндекс плюсуюНа) жЫ
                        кредиты[хуиндекс] += отдатьКоллекторам нах
                    есть нах
                    найтиКредиты(кредиты) нах
                есть нах
            есть иливжопураз жЫ
                результат(-(Ботан.абсолютли(ставка * какойМножитель)), УВЕД_ПРОИГРЫШ) нах
            есть нах
            показатьБаланс(баланс) нах
        есть нах

        йопта результат(сколькоДобавить, уведомление) жЫ
            красноглазое.чмо(сколькоДобавить, уведомление) нах
            шухер(уведомление + Ботан.абсолютли(сколькоДобавить)) нах
            баланс += сколькоДобавить нах
        есть нах


        /////// | система кредита | /////////////////////////////


        йопта кредит(текстОкна, текстОтказ, сколькоДать) жЫ
            участковый окноТипа сука канает(текстОкна)

            вилкойвглаз (окноТипа типа четко) жЫ
                процентнаяСтавка += 0.1 нах сколькоНадоОтдать внатуре (КРЕДИТ_ДАЕТ + (КРЕДИТ_ДАЕТ*процентнаяСтавка)) нах
                баланс += сколькоДать нах
                кредиты.пупок(0) нах
                найтиКредиты(кредиты) нах
                показатьБаланс(баланс) нах
            есть иливжопураз жЫ
                шухер(текстОтказ) нах
            есть нах
        есть нах

        йопта найтиКредиты(СписокКредитов) жЫ
            ЛИСТ_КРЕДИТОВ.ухтыжептыжМалява сука "" нах

            го (гыы хуиндекс сука 0 нах хуиндекс хуевей СписокКредитов.писькомер нах хуиндекс плюсуюНа) жЫ
                участковый одинКредит внатуре СписокКредитов[хуиндекс]

                красноглазое.чмо(одинКредит) нах
                вилкойвглаз (одинКредит поцик сколькоНадоОтдать) жЫ красноглазое.чмо("щфаитл") нах СписокКредитов.въебатьГовна(одинКредит, 1) нах процентнаяСтавка -= 0.1 нах сколькоНадоОтдать внатуре (КРЕДИТ_ДАЕТ - (КРЕДИТ_ДАЕТ*процентнаяСтавка)) нах двигай есть нах

                участковый текст сука ксива.намутитьЛошка("p")
                участковый текст2 сука ксива.намутитьМалявуГовнодскую("Кредит: " + одинКредит + "/" + сколькоНадоОтдать)
                текст.заделатьПездюка(текст2)
                ЛИСТ_КРЕДИТОВ.заделатьПездюка(текст)
            есть нах
        есть


        
        /////// | другое | /////////////////////////////

        ФОРМА.добавитьВертухай('submit', йопта(хуйня) жЫ
            хуйня.preventDefault() нах

            участковый данные сука захуярить FormData(ФОРМА) нах

            участковый сколькоПоставил сука данные.get("ставочка") нах
            участковый множитель сука данные.get("множитель") нах
  
            крутитьКазик(баланс, сколькоПоставил, множитель) нах
        есть) нах


        показатьБаланс(баланс)
    </script>

    <script src="yopta.js"></script>
</body>

</html>
